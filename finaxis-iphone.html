function makeIcon(lucideName) {
  return function Icon({ size = 24, className = '', strokeWidth = 2, fill = 'none' }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current && window.lucide) {
        ref.current.innerHTML = '';
        const span = document.createElement('span');
        span.setAttribute('data-lucide', lucideName);
        span.style.width = size + 'px';
        span.style.height = size + 'px';
        span.style.display = 'inline-flex';
        ref.current.appendChild(span);
        window.lucide.createIcons({
          attrs: { width: size, height: size, 'stroke-width': strokeWidth, fill }
        });
      }
    }, [size, strokeWidth, fill]);
    return React.createElement('span', { 
      ref, 
      className: 'inline-flex items-center justify-center align-middle ' + className,
      style: { width: size, height: size, lineHeight: 0 }
    });
  };
}

const fmt = (num) => `¥${Number(num || 0).toLocaleString()}`;
const fmtCompact = (num) => {
  const n = Number(num || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 100000000) return `${sign}¥${(abs / 100000000).toFixed(abs % 100000000 === 0 ? 0 : 1)}億`;
  if (abs >= 10000) return `${sign}¥${(abs / 10000).toFixed(abs % 10000 === 0 ? 0 : 1)}万`;
  return `${sign}¥${abs.toLocaleString()}`;
};
const pad = (n) => String(n).padStart(2, '0');

const getCalendarDaysArr = (y, m) => {
  const firstDay = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const days = [];
  for (let i = 0; i < firstDay; i++) days.push(null);
  for (let i = 1; i <= daysInMonth; i++) days.push(i);
  return days;
};

    };
    window.visualViewport.addEventListener('resize', handler);

  const [reorderMode, setReorderMode] = useState(null); // null | 'cards' | 'prepaids' | 'categories'

  const moveItem = (list, setList, id, dir) => {
    const idx = list.findIndex(x => x.id === id);
    if (idx === -1) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= list.length) return;
    const copy = [...list];
    [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
    setList(copy);
  };

  const cycleMonthsMap = { monthly: 1, quarterly: 3, biannual: 6, annual: 12 };

  const isFixedInMonth = (fc, ymStr) => {
    if (fc.endDate && ymStr > fc.endDate) return false;
    const start = fc.startMonth || '2000-01';
    if (ymStr < start) return false;
    const [sy, sm] = start.split('-').map(Number);
    const [ty, tm] = ymStr.split('-').map(Number);
    const diff = (ty - sy) * 12 + (tm - sm);
    const cycleMonths = cycleMonthsMap[fc.cycle] || 1;
    return diff >= 0 && diff % cycleMonths === 0;
  };

  const currentMonthData = useMemo(() => {
    const ymStr = CURRENT_MONTH;
    const mLedger = ledger.filter(item => item.date && item.date.startsWith(ymStr) && !item.exclude);
    const mIncomes = incomes.filter(item => item.date && item.date.startsWith(ymStr));
    const mFixedCosts = fixedCosts.filter(item => isFixedInMonth(item, ymStr));
    const totalIncome = mIncomes.reduce((sum, i) => sum + (Number(i.amount)||0), 0);
    const totalExpense = mLedger.reduce((sum, i) => sum + (Number(i.amount)||0), 0) + mFixedCosts.reduce((sum, i) => sum + (Number(i.amount)||0), 0);
    return { totalIncome, totalExpense, surplus: totalIncome - totalExpense };
  }, [ledger, incomes, fixedCosts]);

  const totals = useMemo(() => {
    const ym = `${new Date().getFullYear()}-${pad(new Date().getMonth() + 1)}`;

      if (settlements.includes(`${c.id}_${ym}`)) return s;
      const lSum = ledger.filter(l => l.methodId === c.id && l.date?.startsWith(CURRENT_MONTH)).reduce((ss, l) => ss + (Number(l.amount)||0), 0);
      const fSum = fixedCosts.filter(f => f.methodId === c.id && f.cycle === 'monthly').reduce((ss, f) => ss + (Number(f.amount)||0), 0);
      return s + lSum + fSum;
    }, 0);
    const assetSum = banks.reduce((s, b) => s + (Number(b.balance)||0), 0) + 
                     cash.reduce((s, c) => s + (Number(c.balance)||0), 0) +

                     prepaids.reduce((s, p) => s + (Number(p.balance)||0), 0) + 
                     points.reduce((s, p) => s + ((Number(p.balance)||0) * (Number(p.rate)||1)), 0);
    const cashBankSum = banks.reduce((s, b) => s + (Number(b.balance)||0), 0) +

    return { assets: assetSum, balance: assetSum - unpaidCard, unpaidCard, cashBank: cashBankSum };

  const totalCategoryBudget = useMemo(() =>

  const effectiveBudget = totalCategoryBudget > 0 ? totalCategoryBudget : appSettings.monthlyBudget;

  const budgetProgress = useMemo(() => {

  const historyChartData = useMemo(() => {

  const homeCalYear = homeCalDate.getFullYear();
  const homeCalMonth = homeCalDate.getMonth() + 1;
  const homeCalData = useMemo(() => {
    const dayData = {};
    const payMonthIdx = homeCalMonth - 1; 
    const closeMonthIdx = payMonthIdx - 1; 

    cards.forEach(c => {
      const cDate = Number(c.closingDate) || 99;
      let startDate, endDate;
      if (cDate === 99) {
        startDate = new Date(homeCalYear, closeMonthIdx, 1);
        endDate = new Date(homeCalYear, closeMonthIdx + 1, 0, 23, 59, 59);
      } else {
        startDate = new Date(homeCalYear, closeMonthIdx - 1, cDate + 1);
        endDate = new Date(homeCalYear, closeMonthIdx, cDate, 23, 59, 59);
      }

      const lSum = ledger.filter(l => l.methodId === c.id && !l.exclude).reduce((ss, l) => {
          const lDate = new Date(l.date);
          if (lDate >= startDate && lDate <= endDate) return ss + (Number(l.amount) || 0);
          return ss;
      }, 0);
      const fSum = fixedCosts.filter(f => f.methodId === c.id && f.cycle === 'monthly').reduce((ss, f) => ss + (Number(f.amount) || 0), 0);
      const totalCardSum = lSum + fSum;

      if (totalCardSum > 0) {
        let pDay = Number(c.paymentDate) || 31;
        const lastDayOfPayMonth = new Date(homeCalYear, payMonthIdx + 1, 0).getDate();
        if (pDay > lastDayOfPayMonth) pDay = lastDayOfPayMonth;
        
        let adjDate = new Date(homeCalYear, payMonthIdx, pDay);
        if (adjDate.getDay() === 0 || adjDate.getDay() === 6) {
          const dir = c.holidayAdjustment === 'prev' ? -1 : 1;
          while (adjDate.getDay() === 0 || adjDate.getDay() === 6) adjDate.setDate(adjDate.getDate() + dir);
        }
        
        if (adjDate.getMonth() === payMonthIdx) {
          const finalDay = adjDate.getDate();
          if (!dayData[finalDay]) dayData[finalDay] = { total: 0, banks: {} };
          dayData[finalDay].total += totalCardSum;
          
          const bankId = c.bankId || 'unknown';
          if (!dayData[finalDay].banks[bankId]) {
            const b = banks.find(b => b.id === bankId);
            dayData[finalDay].banks[bankId] = { name: b ? b.name : '未設定', amount: 0, cards: [], isSettled: true };
          }
          
          dayData[finalDay].banks[bankId].amount += totalCardSum;
          dayData[finalDay].banks[bankId].cards.push({ ...c, amount: totalCardSum });
          
          const ymStr = `${homeCalYear}-${pad(homeCalMonth)}`;

  const viewYear = viewDate.getFullYear();

    else if (type === 'category') {

      delete cleanCat._isNew;

        if (oldName && oldName !== cleanCat.name) {

  // CSVインポート: 家計簿の取引データを一括追加
  const [importPreview, setImportPreview] = useState(null); // { rows: [...], errors: [...] }
  const [csvImportMethod, setCsvImportMethod] = useState('cash');
  const csvInputRef = useRef(null);
  const backupInputRef = useRef(null);

  const parseCsvText = (text) => {
    // BOM除去
    text = text.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return { rows: [], errors: ['データが空、もしくはヘッダー行のみです'] };
    
    // ヘッダー解析（小文字化して正規化）
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/["']/g, ''));
    
    // 必須カラム探索
    const dateIdx = headers.findIndex(h => /日付|date/.test(h));
    const amountIdx = headers.findIndex(h => /金額|amount|price/.test(h));
    const nameIdx = headers.findIndex(h => /内容|名称|memo|name|description|摘要|店舗|店名/.test(h));
    const categoryIdx = headers.findIndex(h => /カテゴリ|category|分類/.test(h));
    const methodIdx = headers.findIndex(h => /支払方法|支払い方法|method|payment/.test(h));

    // 支払方法名 → methodId の解決テーブル
    const methodNameToId = { '現金': 'cash', 'cash': 'cash' };
    cards.forEach(c => { methodNameToId[c.name] = c.id; });
    banks.forEach(b => { methodNameToId[b.name] = b.id; if (b.branch) methodNameToId[`${b.name} ${b.branch}`] = b.id; });
    prepaids.forEach(p => { methodNameToId[p.name] = p.id; });
    cash.forEach(c => { methodNameToId[c.name] = c.id; });
    
    if (dateIdx === -1 || amountIdx === -1) {
      return { rows: [], errors: ['「日付」「金額」のカラムが見つかりません。\nCSVに 日付,金額 列が必要です。'] };
    }
    
    const rows = [];
    const errors = [];
    
    for (let i = 1; i < lines.length; i++) {
      const cells = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
      const dateRaw = cells[dateIdx];
      const amountRaw = cells[amountIdx];
      
      // 日付正規化 (YYYY/M/D → YYYY-MM-DD)
      let date = dateRaw;
      const m = dateRaw.match(/^(\d{4})[/\-](\d{1,2})[/\-](\d{1,2})/);
      if (m) date = `${m[1]}-${pad(parseInt(m[2]))}-${pad(parseInt(m[3]))}`;
      
      // 金額正規化（¥, カンマ, スペース除去）
      const amount = Number(String(amountRaw).replace(/[¥,\s]/g, ''));
      
      if (!date.match(/^\d{4}-\d{2}-\d{2}$/) || isNaN(amount) || amount === 0) {
        errors.push(`${i+1}行目: 日付or金額が不正 (${dateRaw}, ${amountRaw})`);
        continue;
      }
      
      // マイナス金額は支出として絶対値化
      const absAmount = Math.abs(amount);
      
      // カテゴリマッチング（既存カテゴリ名で部分一致、なければ「その他」）
      let category = 'その他';
      if (categoryIdx !== -1 && cells[categoryIdx]) {
        const catRaw = cells[categoryIdx];
        const found = categories.find(c => c.name === catRaw || catRaw.includes(c.name));
        if (found) category = found.name;
      }
      
      const name = nameIdx !== -1 ? (cells[nameIdx] || '') : '';

      // 支払方法列があれば名前でID解決、なければnull（confirmImportでフォールバック）
      let methodId = null;
      if (methodIdx !== -1 && cells[methodIdx]) {
        const raw = cells[methodIdx].trim();
        methodId = methodNameToId[raw] || null;
      }

      rows.push({
        id: `imp-${Date.now()}-${i}`,
        date,
        amount: absAmount,
        name,
        category,
        methodId,
        exclude: false
      });
    }
    
    return { rows, errors };
  };

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const result = parseCsvText(ev.target.result);
      if (result.rows.length === 0 && result.errors.length > 0) {
        showToast(result.errors[0], true);
        return;
      }
      setImportPreview(result);
    };
    reader.onerror = () => showToast("ファイル読み込みエラー", true);
    reader.readAsText(file, 'UTF-8');
    e.target.value = ''; // 同じファイルを再選択できるようリセット
  };

  const confirmImport = () => {
    if (!importPreview || importPreview.rows.length === 0) return;
    const existingKeys = new Set(ledger.map(l => `${l.date}|${l.amount}|${l.name}`));
    const newRows = importPreview.rows
      .filter(r => !existingKeys.has(`${r.date}|${r.amount}|${r.name}`))
      .map(r => ({ ...r, methodId: r.methodId ?? csvImportMethod }));
    const skipped = importPreview.rows.length - newRows.length;
    setLedger([...newRows, ...ledger]);
    showToast(`${newRows.length}件を追加${skipped > 0 ? `（重複${skipped}件スキップ）` : ''}`);
    setImportPreview(null);
  };

  // CSVテンプレートを生成してダウンロード
  const downloadCsvTemplate = () => {
    const today = new Date();
    const y = today.getFullYear();
    const m = pad(today.getMonth() + 1);
    const sampleRows = [
      ['日付', '金額', '内容', 'カテゴリ', '支払方法'],
      [`${y}-${m}-01`, '1280', 'ランチ', '食費', '現金'],
      [`${y}-${m}-02`, '3500', 'スーパー', '食費', '現金'],
      [`${y}-${m}-03`, '580', '電車', '交通費', '現金'],
      [`${y}-${m}-03`, '980', 'ドラッグストア', '日用品', '現金'],
      [`${y}-${m}-04`, '4500', '飲み会', '交際費', '現金'],
      [`${y}-${m}-06`, '75000', '家賃', '住宅', '現金'],
      [`${y}-${m}-07`, '1490', 'Netflix', 'その他', '現金'],
      [`${y}-${m}-09`, '3280', 'ユニクロ', '美容・衣服', '現金'],
    ];
    const csv = sampleRows.map(r => r.join(',')).join('\r\n');
    const bom = '\uFEFF';
    const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finaxis_import_template_${y}-${m}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("テンプレートをダウンロードしました");
  };

  // 汎用CSVエクスポート関数
  const exportCsv = (filename, headers, rows, emptyMsg) => {
    if (rows.length === 0) {
      showToast(emptyMsg || 'エクスポートするデータがありません', true);
      return;
    }
    const escapeCell = (v) => {
      const s = String(v ?? '');
      if (/[,"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    const csv = [headers, ...rows].map(r => r.map(escapeCell).join(',')).join('\r\n');
    const bom = '\uFEFF';
    const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`${rows.length}件をエクスポートしました`);
  };

  // 各カテゴリのCSVエクスポート
  const getMethodName = (mid) => {
    if (mid === 'cash') return '現金';
    const c = cards.find(x => x.id === mid); if (c) return c.name;
    const b = banks.find(x => x.id === mid); if (b) return b.name;
    const p = prepaids.find(x => x.id === mid); if (p) return p.name;
    const cs = cash.find(x => x.id === mid); if (cs) return cs.name;
    return mid || '';
  };

  const exportLedgerCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_ledger_${dateStr}.csv`,
      ['日付', '金額', '内容', 'カテゴリ', '支払方法', '集計除外'],
      ledger.map(l => [l.date, l.amount, l.name || '', l.category || '', getMethodName(l.methodId), l.exclude ? 'はい' : '']),
      '取引履歴がありません'
    );
  };
  const exportIncomesCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_incomes_${dateStr}.csv`,
      ['日付', '金額', '内容', 'カテゴリ'],
      incomes.map(i => [i.date, i.amount, i.name || '', i.category || '']),
      '収入記録がありません'
    );
  };
  const exportFixedCostsCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_fixedcosts_${dateStr}.csv`,
      ['サービス名', '月額', '支払日', 'カテゴリ', '支払方法'],
      fixedCosts.map(f => [f.name, f.amount, f.paymentDay, f.category, getMethodName(f.methodId)]),
      '固定費がありません'
    );
  };
  const exportBanksCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_banks_${dateStr}.csv`,
      ['銀行名', '支店名', '残高', '記入で表示'],
      banks.map(b => [b.name, b.branch || '', b.balance, b.visibleInEntry !== false ? 'はい' : 'いいえ']),
      '銀行口座がありません'
    );
  };
  const exportCardsCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_cards_${dateStr}.csv`,
      ['カード名', 'ブランド', '締日', '支払日', '休日処理', '引落銀行', '記入で表示'],
      cards.map(c => [c.name, c.brand || '', c.closingDate, c.paymentDate, c.holidayAdjustment === 'prev' ? '前営業日' : '翌営業日', banks.find(b=>b.id===c.bankId)?.name || '', c.visibleInEntry !== false ? 'はい' : 'いいえ']),
      'カードがありません'
    );
  };
  const exportCashCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_cash_${dateStr}.csv`,
      ['名称', '残高'],
      cash.map(c => [c.name, c.balance]),
      '現金記録がありません'
    );
  };
  const exportPointsCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_points_${dateStr}.csv`,
      ['ポイント名', '所持数', 'レート', '円換算'],
      points.map(p => [p.name, p.balance, p.rate || 1, Number(p.balance) * (Number(p.rate)||1)]),
      'ポイントがありません'
    );
  };
  const exportPrepaidsCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_prepaids_${dateStr}.csv`,
      ['サービス名', '残高'],
      prepaids.map(p => [p.name, p.balance]),
      'プリペイドがありません'
    );
  };
  const exportInvestmentsCsv = () => {
    const dateStr = new Date().toISOString().slice(0,10);
    exportCsv(
      `finaxis_investments_${dateStr}.csv`,
      ['銘柄', '証券口座', '評価額'],
      investments.map(i => [i.name, i.broker || '', i.balance]),
      '積立記録がありません'
    );
  };

  const exportBackupJson = () => {
    const data = { banks, cards, investments, prepaids, points, cash, ledger, incomes, fixedCosts, categories, settlements, appSettings };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finaxis_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("バックアップをダウンロードしました");
  };

  const handleBackupImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.ledger || !data.banks) { showToast("無効なバックアップファイルです", true); return; }
        if (data.banks) setBanks(data.banks);
        if (data.cards) setCards(data.cards);
        if (data.investments) setInvestments(data.investments);
        if (data.prepaids) setPrepaids(data.prepaids);
        if (data.points) setPoints(data.points);
        if (data.cash) setCash(data.cash);
        if (data.ledger) setLedger(data.ledger);
        if (data.incomes) setIncomes(data.incomes);
        if (data.fixedCosts) setFixedCosts(data.fixedCosts);
        if (data.categories) setCategories(data.categories);
        if (data.settlements) setSettlements(data.settlements);
        if (data.appSettings) setAppSettings(prev => ({ ...prev, ...data.appSettings }));
        showToast("バックアップを復元しました");
        setSettingsView('main');
      } catch {
        showToast("ファイルの読み込みに失敗しました", true);
      }
    };
    reader.readAsText(file, 'UTF-8');
    e.target.value = '';
  };

  const tooltipBg = appSettings.darkMode ? '#030d08' : '#ffffff';
  const tooltipBorder = appSettings.darkMode ? 'rgba(0,200,150,0.3)' : '#e2e8f0';

  // type未定義の旧データは expense とみなす
  const expenseCategories = categories.filter(c => (c.type || 'expense') === 'expense');
  const incomeCategories = categories.filter(c => c.type === 'income');
  const categoryOptions = expenseCategories.map(c => ({ label: c.name, value: c.name, emoji: c.emoji }));
  const incomeCategoryOptions = incomeCategories.map(c => ({ label: c.name, value: c.name, emoji: c.emoji }));
  
  // 支払方法: visibleInEntry === false は除外
  const paymentOptions = [
    { label: '現金', value: 'cash', emoji: '💴' },
    ...cards.filter(c => c.visibleInEntry !== false).map(c => ({ label: c.name, value: c.id, emoji: '💳', sublabel: c.brand })),
    ...prepaids.filter(p => p.visibleInEntry !== false).map(p => ({ label: p.name, value: p.id, emoji: '📱' })),
    ...banks.filter(b => b.visibleInEntry !== false).map(b => ({ label: b.branch ? `${b.name} ${b.branch}` : b.name, value: b.id, emoji: '🏦' })),
    ...cash.filter(c => c.visibleInEntry !== false).map(c => ({ label: c.name, value: c.id, emoji: '💵' }))
  ];

  const renderCustomizedLabel = ({ cx, cy, midAngle, innerRadius, outerRadius, percent, name, index }) => {
    // 全カテゴリ表示（小さなスライスはフォント縮小して対応）
    const isSmall = percent < 0.05;
    const fontSize = isSmall ? 9 : 13;
    const subFontSize = isSmall ? 8 : 12;
    const offset = isSmall ? 5 : 7;
    
    const RADIAN = Math.PI / 180;
    const radius = innerRadius + (outerRadius - innerRadius) * 0.55;
    const x = cx + radius * Math.cos(-midAngle * RADIAN);
    const y = cy + radius * Math.sin(-midAngle * RADIAN);

    return (
      <g key={`label-${index}`}>
        {/* カテゴリ名 */}
        <text 
          x={x} 
          y={y - offset} 
          fill="#ffffff"
          textAnchor="middle"
          dominantBaseline="central" 
          fontSize={fontSize}
          fontWeight="900"
          stroke="rgba(0,0,0,0.6)"
          strokeWidth={isSmall ? 2.5 : 3.5}
          paintOrder="stroke"
          style={{ letterSpacing: '0.3px' }}
        >
          {String(name)}
        </text>
        {/* パーセント */}
        <text 
          x={x} 
          y={y + offset + 2} 
          fill="#ffffff"
          textAnchor="middle"
          dominantBaseline="central" 
          fontSize={subFontSize}
          fontWeight="800"
          stroke="rgba(0,0,0,0.6)"
          strokeWidth={isSmall ? 2.5 : 3.5}
          paintOrder="stroke"
          opacity={0.95}
        >
          {(percent * 100).toFixed(percent < 0.01 ? 1 : 0)}%
        </text>
      </g>
    );
  };

  const renderActiveShape = (props) => {
    const { cx, cy, innerRadius, outerRadius, startAngle, endAngle, fill, payload, percent } = props;
    const isDark = appSettings.darkMode;
    return (
      <g>
        {/* 中央のテキスト（選択中のセグメント情報） */}
        <text x={cx} y={cy - 14} textAnchor="middle" fill={isDark ? '#ffffff' : '#1e293b'} fontSize="13" fontWeight="700" opacity="0.6">
          {String(payload.name)}
        </text>
        <text x={cx} y={cy + 6} textAnchor="middle" fill={fill} fontSize="18" fontWeight="900">
          {fmt(payload.value)}
        </text>
        <text x={cx} y={cy + 24} textAnchor="middle" fill={isDark ? '#ffffff' : '#1e293b'} fontSize="11" fontWeight="700" opacity="0.5">
          {(percent * 100).toFixed(1)}%
        </text>
        {/* 強調セクター */}
        <Sector cx={cx} cy={cy} innerRadius={innerRadius} outerRadius={outerRadius + 8} startAngle={startAngle} endAngle={endAngle} fill={fill} />
      </g>
    );
  };

  // ==========================================
  // 4. メインレンダリング
  // ==========================================
  return (
    <div className={`${appSettings.darkMode ? 'dark' : ''} h-full`} data-theme={appSettings.darkMode ? 'dark' : 'light'}>
      <div className="min-h-screen bg-slate-50 dark:bg-black text-slate-900 dark:text-white font-sans selection:bg-white/30 relative overflow-hidden transition-colors duration-500">
        <style>{`
          /* Tailwind の darkMode: 'class' 戦略を JS なしで強制適用するためのフォールバック */
          @media (prefers-color-scheme: light) {
            html:not(.dark) { color-scheme: light; }
          }
          html.dark { color-scheme: dark; }

          * { -webkit-tap-highlight-color: transparent; }
          /* タッチ操作: ダブルタップズームを無効化しつつスクロールは許可 */
          button, [role="button"], input, select, textarea { touch-action: manipulation; }
          .no-scrollbar::-webkit-scrollbar { display: none; }
          /* セーフエリア: env() でノッチ・Dynamic Island・ホームバーに対応 */
          .pt-safe { padding-top: max(1.5rem, env(safe-area-inset-top)); }
          .pb-safe { padding-bottom: calc(112px + max(0.75rem, env(safe-area-inset-bottom))); }
          .pb-nav-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
          /* スムーズ慣性スクロール (iOS Safari) */
          .ios-scroll { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
          /* キーボード表示時にBottomSheetを持ち上げる */
          :root { --kb-offset: 0px; }
          :root { --accent: #00c896; --accent-dark: #009e78; --accent-glow: rgba(0,200,150,0.35); }
          .btn-primary { background: linear-gradient(135deg, #1e293b, #334155); color: #fff; font-weight: 900; border-radius: 24px; transition: transform 0.2s; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
          .dark .btn-primary { background: linear-gradient(135deg, #001408, #0a1a0f); color: #00c896; box-shadow: 0 8px 32px rgba(0,200,150,0.2), inset 0 0 0 1px rgba(0,200,150,0.3); }
          .btn-primary:active { transform: scale(0.96); }
          @keyframes plusPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25), 0 12px 40px rgba(0,0,0,0.7); } 50% { box-shadow: 0 0 0 8px rgba(255,255,255,0), 0 12px 40px rgba(0,0,0,0.5); } }
          .plus-btn { animation: plusPulse 3s ease-in-out infinite; }
          html.dark .card-accent-bar { box-shadow: 0 0 10px rgba(0,200,150,0.8); }
        `}</style>

        <header className="sticky top-0 z-20 bg-white/90 dark:bg-black/95 backdrop-blur-2xl border-b border-slate-200 dark:border-[#00c896]/12 px-6 pb-4 pt-safe flex items-center justify-between transition-colors">
          <h1 className="text-2xl font-black tracking-tighter text-slate-900 dark:text-white">Fin<span className="text-slate-900 dark:text-[#00c896]" style={appSettings.darkMode ? { textShadow: '0 0 20px rgba(0,200,150,0.7)' } : {}}>axis</span></h1>
        </header>

        <main className="max-w-4xl mx-auto p-4 md:p-6 pb-safe relative z-10">
          {/* ==================== ホーム ==================== */}
          {activeTab === 'home' && (
            <div className="space-y-6">
              <div className="grid grid-cols-2 gap-4">
                <KpiCard title="総資産" amount={totals.assets} color="text-slate-800 dark:text-white" fullFormat />
                <KpiCard title="残高" amount={totals.balance} color="text-slate-700 dark:text-white" fullFormat />
                {effectiveBudget > 0
                  ? <KpiCard title="予算進捗" amount={budgetProgress} suffix="%" color={budgetProgress > 90 ? "text-red-500" : "text-slate-700 dark:text-white"} />
                  : <KpiCard title="現金" amount={totals.cashBank} color="text-emerald-600 dark:text-emerald-400" fullFormat />
                }
                <KpiCard title="引落予定" amount={totals.unpaidCard} color="text-rose-500 dark:text-rose-400" fullFormat />
              </div>

              <GlassCard title="今月の収支">
                <div className="grid grid-cols-3 gap-3 text-center">
                  <div>
                    <div className="text-[11px] font-bold text-slate-400 dark:text-white/30 mb-1">収入</div>
                    <div className="text-[15px] font-black text-emerald-600 dark:text-emerald-400">{fmt(currentMonthData.totalIncome)}</div>

                    <div className="text-[11px] font-bold text-slate-400 dark:text-white/30 mb-1">支出</div>

                    <div className="text-[11px] font-bold text-slate-400 dark:text-white/30 mb-1">収支</div>

              {effectiveBudget > 0 && (
                <GlassCard title="月間予算分析" icon={<BarChart3 size={18} className="text-slate-800 dark:text-white"/>}>
                  <div className="flex justify-between items-end mb-3 px-1">

                  </div>
                </GlassCard>

                  <button onClick={() => setHomeCalDate(new Date(homeCalYear, homeCalMonth, 1))} className="p-2 bg-slate-100 dark:bg-white/5 rounded-full"><ChevronRight size={20}/></button>
                </div>

                {/* 曜日ヘッダー */}
                <div className="grid grid-cols-7 gap-1 sm:gap-1.5 mb-2">
                  {['月','火','水','木','金','土','日'].map((w, i) => (
                    <div key={`wkh-home-${i}`} className={`text-center text-[11px] font-black uppercase tracking-widest pb-2 ${i === 5 ? 'text-slate-400 dark:text-white/40' : i === 6 ? 'text-slate-400 dark:text-white/25' : 'text-slate-400 dark:text-white/30'}`}>
                      {w}
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-1 sm:gap-1.5">
                  {getCalendarDaysArr(homeCalYear, homeCalMonth).map((d, i) => {
                    const dayInfo = d ? homeCalData[d] : null;
                    const hasData = dayInfo && dayInfo.total > 0;
                    // 精算済 / 未精算の判定
                    const banksArr = hasData ? Object.values(dayInfo.banks) : [];
                    const hasSettled = banksArr.some(b => b.isSettled);
                    const hasUnsettled = banksArr.some(b => !b.isSettled);

                    const isSelected = selectedHomeDay === d;

                      >

                {selectedHomeDay && homeCalData[selectedHomeDay] && (

                {!confirmDelete ? <button onClick={()=>setConfirmDelete(true)} className="text-slate-400"><Trash2 size={22}/></button> : <button onClick={()=>{ 
                  if(editingItem.type==='expense'){ setLedger(ledger.filter(l=>l.id!==editingItem.data.id)); } 
                  else if(editingItem.type==='bank'){ setBanks(banks.filter(b=>b.id!==editingItem.data.id)); } 
                  else if(editingItem.type==='cash'){ setCash(cash.filter(c=>c.id!==editingItem.data.id)); }
                  else if(editingItem.type==='card'){ setCards(cards.filter(c=>c.id!==editingItem.data.id)); }
                  else if(editingItem.type==='point'){ setPoints(points.filter(p=>p.id!==editingItem.data.id)); }
                  else if(editingItem.type==='invest'){ setInvestments(investments.filter(i=>i.id!==editingItem.data.id)); }
                  else if(editingItem.type==='prepaid'){ setPrepaids(prepaids.filter(p=>p.id!==editingItem.data.id)); }
                  else if(editingItem.type==='income'){ setIncomes(incomes.filter(i=>i.id!==editingItem.data.id)); }
                  else if(editingItem.type==='fixedCost'){ setFixedCosts(fixedCosts.filter(f=>f.id!==editingItem.data.id)); }
                  else if(editingItem.type==='category'){ setCategories(categories.filter(ca=>ca.id!==editingItem.data.id)); }
                  setEditingItem(null); setConfirmDelete(false); showToast("削除しました"); 
                }} className="bg-red-500 px-4 py-2 rounded-xl text-xs font-black text-white">削除実行</button>}
              </div>
              
              <div className="space-y-4 overflow-y-auto no-scrollbar ios-scroll px-8 pb-4 flex-1">
                {(editingItem.type === 'expense' || editingItem.type === 'income') && (
                  <>
                    <InputField label="日付" type="date" value={editingItem.data.date || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, date:e.target.value}})} />
                    <InputField label="金額 (¥)" type="number" value={editingItem.data.amount || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, amount:Number(e.target.value)}})} />
                    <InputField label="内容・メモ" value={editingItem.data.name || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, name:e.target.value}})} />
                    {editingItem.type === 'expense' && (
                      <CheckboxSelect label="カテゴリ" value={editingItem.data.category || ''} options={categoryOptions} onChange={(v) => setEditingItem({...editingItem, data:{...editingItem.data, category: v}})} />
                    )}
                    {editingItem.type === 'income' && (
                      <CheckboxSelect label="カテゴリ" value={editingItem.data.category || ''} options={incomeCategoryOptions} onChange={(v) => setEditingItem({...editingItem, data:{...editingItem.data, category: v}})} />
                    )}
                    {editingItem.type === 'expense' && (
                      <CheckboxSelect label="支払方法" value={editingItem.data.methodId || ''} options={paymentOptions} onChange={(v) => setEditingItem({...editingItem, data:{...editingItem.data, methodId: v}})} />
                    )}
                    {editingItem.type === 'expense' && (
                      <ToggleRow label="集計の対象外にする" icon={<EyeOff size={18}/>} active={editingItem.data.exclude || false} onClick={() => setEditingItem({...editingItem, data:{...editingItem.data, exclude: !editingItem.data.exclude}})} />
                    )}
                  </>
                )}

                {['bank', 'cash', 'invest', 'prepaid', 'point'].includes(editingItem.type) && (
                  <>
                    <InputField label="名称" value={editingItem.data.name || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, name:e.target.value}})} />
                    <InputField label={editingItem.type === 'point' ? '所持数' : '金額・残高'} type="number" value={editingItem.data.balance || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, balance:Number(e.target.value)}})} />
                    {editingItem.type === 'bank' && <InputField label="支店名" value={editingItem.data.branch || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, branch:e.target.value}})} />}
                    {editingItem.type === 'invest' && <InputField label="証券口座" value={editingItem.data.broker || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, broker:e.target.value}})} />}
                    {editingItem.type === 'point' && <InputField label="レート (1pt = ?円)" type="number" step="0.1" value={editingItem.data.rate || 1} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, rate:Number(e.target.value)}})} />}
                    {/* 表示ON/OFFトグル */}
                    {['bank', 'cash', 'prepaid'].includes(editingItem.type) && (
                      <ToggleRow 
                        label="家計簿の記入に表示する" 
                        icon={<Eye size={18}/>} 
                        active={editingItem.data.visibleInEntry !== false} 
                        onClick={() => setEditingItem({...editingItem, data:{...editingItem.data, visibleInEntry: !(editingItem.data.visibleInEntry !== false)}})} 
                      />
                    )}
                  </>
                )}

                {editingItem.type === 'card' && (
                  <>
                    <InputField label="カード名" value={editingItem.data.name || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, name:e.target.value}})} />
                    <div className="flex flex-col gap-2">
                      <label className="text-[11px] font-black text-slate-500 dark:text-white/40 uppercase tracking-widest pl-4">ブランド</label>
                      <select className="h-16 bg-slate-100 dark:bg-black border border-slate-200 dark:border-white/[0.07] rounded-[24px] px-5 outline-none font-bold appearance-none" value={editingItem.data.brand || 'JCB'} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, brand:e.target.value}})}>
                        <option value="JCB">JCB</option><option value="VISA">VISA</option><option value="MASTERCARD">MASTERCARD</option><option value="AMEX">AMEX</option><option value="OTHER">その他</option>
                      </select>
                    </div>
                    <div className="flex flex-col gap-2">
                      <label className="text-[11px] font-black text-slate-500 dark:text-white/40 uppercase tracking-widest pl-4">締日</label>
                      <select className="h-16 bg-slate-100 dark:bg-black border border-slate-200 dark:border-white/[0.07] rounded-[24px] px-5 outline-none font-bold appearance-none" value={String(editingItem.data.closingDate || '99')} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, closingDate:e.target.value}})}>
                        {[...Array(31)].map((_,i)=><option key={i+1} value={String(i+1)}>{i+1}日</option>)}<option value="99">末日</option>
                      </select>
                    </div>
                    <div className="flex flex-col gap-2">
                      <label className="text-[11px] font-black text-slate-500 dark:text-white/40 uppercase tracking-widest pl-4">支払日</label>
                      <select className="h-16 bg-slate-100 dark:bg-black border border-slate-200 dark:border-white/[0.07] rounded-[24px] px-5 outline-none font-bold appearance-none" value={String(editingItem.data.paymentDate || '99')} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, paymentDate:e.target.value}})}>
                        {[...Array(31)].map((_,i)=><option key={i+1} value={String(i+1)}>{i+1}日</option>)}<option value="99">末日</option>
                      </select>
                    </div>
                    <div className="flex flex-col gap-2">
                      <label className="text-[11px] font-black text-slate-500 dark:text-white/40 uppercase tracking-widest pl-4 flex items-center gap-1.5">
                        休日の場合
                        <span className="text-[10px] font-bold text-slate-400 normal-case tracking-normal">— 土日祝が支払日なら、翌 or 前営業日に</span>
                      </label>
                      <select className="h-16 bg-slate-100 dark:bg-black border border-slate-200 dark:border-white/[0.07] rounded-[24px] px-5 outline-none font-bold appearance-none" value={editingItem.data.holidayAdjustment || 'next'} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, holidayAdjustment:e.target.value}})}>
                        <option value="next">翌営業日</option><option value="prev">前営業日</option>
                      </select>
                    </div>
                    <div className="flex flex-col gap-2">
                      <label className="text-[11px] font-black text-slate-500 dark:text-white/40 uppercase tracking-widest pl-4">引落銀行</label>
                      <select className="h-16 bg-slate-100 dark:bg-black border border-slate-200 dark:border-white/[0.07] rounded-[24px] px-5 outline-none font-bold appearance-none" value={editingItem.data.bankId || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, bankId:e.target.value}})}>
                        <option value="">未設定</option>
                        {banks.map(b => <option key={b.id} value={b.id}>{String(b.name)}{b.branch ? ` ${b.branch}` : ''}</option>)}
                      </select>
                    </div>
                    <InputField label="年会費 (¥)" type="number" value={editingItem.data.annualFee ?? ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, annualFee:Number(e.target.value)}})} hint="無料の場合は0" />
                    <InputField label="発行日" type="date" value={editingItem.data.issueDate || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, issueDate:e.target.value}})} />
                    <ToggleRow
                      label="家計簿の記入に表示する"
                      icon={<Eye size={18}/>}
                      active={editingItem.data.visibleInEntry !== false}
                      onClick={() => setEditingItem({...editingItem, data:{...editingItem.data, visibleInEntry: !(editingItem.data.visibleInEntry !== false)}})}
                    />
                  </>
                )}

                {editingItem.type === 'category' && (
                  <>
                    <div className="text-[11px] font-black uppercase tracking-widest pl-4 mb-2 text-slate-500 dark:text-white/40">
                      {editingItem.data.type === 'income' ? '💰 収入カテゴリ' : '💸 支出カテゴリ'}
                    </div>
                    <InputField label="カテゴリ名" value={editingItem.data.name || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, name:e.target.value}})} placeholder={editingItem.data.type === 'income' ? '例: 還付金、お小遣い' : '例: サブスク、ペット'} />
                    <InputField label="絵文字（1つ）" value={editingItem.data.emoji || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, emoji:e.target.value}})} placeholder="🏠" />
                    {editingItem.data.type !== 'income' && (
                      <InputField label="月間予算（任意）" type="number" value={editingItem.data.budget || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, budget:Number(e.target.value)}})} hint="0で予算なし" />
                    )}
                  </>
                )}

                {editingItem.type === 'fixedCost' && (
                  <>
                    <InputField label="名称" value={editingItem.data.name || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, name:e.target.value}})} />
                    <InputField label="金額 (¥)" type="number" value={editingItem.data.amount || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, amount:Number(e.target.value)}})} />
                    <InputField label="毎月の支払日" type="number" min="1" max="31" value={editingItem.data.paymentDay || ''} onChange={e=>setEditingItem({...editingItem, data:{...editingItem.data, paymentDay:Number(e.target.value)}})} />
                    <CheckboxSelect label="カテゴリ" value={editingItem.data.category || ''} options={categoryOptions} onChange={(v) => setEditingItem({...editingItem, data:{...editingItem.data, category: v}})} />
                    <CheckboxSelect label="支払方法" value={editingItem.data.methodId || ''} options={paymentOptions} onChange={(v) => setEditingItem({...editingItem, data:{...editingItem.data, methodId: v}})} />
                  </>
                )}
              </div>

              <div className="flex gap-4 px-8 pt-4 border-t border-slate-200 dark:border-white/[0.07] shrink-0" style={{ paddingBottom: 'max(1.5rem, env(safe-area-inset-bottom))' }}>
                <button onClick={()=>{setEditingItem(null); setConfirmDelete(false);}} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 rounded-2xl font-black text-slate-500 dark:text-white/50">閉じる</button>
                <button onClick={saveEditedItem} className="flex-1 py-4 btn-primary rounded-2xl font-black text-white dark:text-black">保存する</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function NavBtn({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} className={`flex-1 flex flex-col items-center justify-center gap-1 h-16 relative transition-all ${active ? 'text-slate-900 dark:text-white' : 'text-slate-400 dark:text-white/25'}`}>
      <span className={`transition-transform ${active ? 'scale-110' : ''}`}>{icon}</span>
      <span className="text-[10px] font-black uppercase tracking-tighter">{String(label)}</span>
      {active && <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-[#007a5e] dark:bg-[#00c896]" style={{ boxShadow: '0 0 8px rgba(0,200,150,0.9)' }}/>}
    </button>
  );
}

// ===== ここまで =====

const rootEl = ReactDOM.createRoot(document.getElementById('root'));
rootEl.render(React.createElement(App));
</script>

</body>
</html>
